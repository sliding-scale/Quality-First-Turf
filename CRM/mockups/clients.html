<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients · Quality First Turf CRM (mockup)</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-nav="clients">
  <div id="page" class="page">
    <div class="page-head">
      <h1>Clients</h1>
      <div class="actions">
        <button class="btn plain" type="button" id="exportBtn">Export</button>
        <a class="btn primary" href="client-new.html">New Client</a>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="list-head"><h2>All clients</h2><span class="muted" id="count"></span></div>

    <div class="toolbar">
      <div class="chips"><button class="chip" type="button" id="typeChip"></button></div>
      <div class="searchbox">
        <span id="searchIc"></span>
        <input id="q" type="search" placeholder="Search clients..." aria-label="Search clients">
      </div>
    </div>

    <div class="table-wrap">
      <table class="table" id="tbl">
        <thead>
          <tr>
            <th><button type="button" data-sort="name">Name <span class="s"></span></button></th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Type</th>
            <th><button type="button" data-sort="daysAgo">Last Activity <span class="s"></span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/clients.js"></script>
</body>
</html>
