<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New client · Quality First Turf CRM (mockup)</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-nav="clients">
  <div id="page" class="page">
    <form class="form-wrap" id="form" novalidate>
      <h1 id="title">New Client</h1>

      <section class="fsec">
        <div><h3>Contact details</h3><p>The main point of contact for this client.</p></div>
        <div class="fields-col">
          <div class="field"><label>Client type</label>
            <div class="seg-radio" role="radiogroup" aria-label="Client type">
              <label><input type="radio" name="type" value="Homeowner" checked><span>Homeowner</span></label>
              <label><input type="radio" name="type" value="Contractor"><span>Contractor</span></label>
            </div></div>
          <div class="frow">
            <div class="field" id="f-first"><label for="first">First name</label><input id="first" name="first" autocomplete="off"></div>
            <div class="field" id="f-last"><label for="last">Last name</label><input id="last" name="last" autocomplete="off"></div>
          </div>
          <div class="field" id="f-company"><label for="company">Company name (where applicable)</label><input id="company" name="company" autocomplete="off"><div class="err">Enter a first name, last name or company name.</div></div>
          <div class="field" id="f-phone"><label for="phone">Phone number</label><input id="phone" name="phone" inputmode="tel" placeholder="(555) 123-4567"><div class="err">Enter a phone number with at least 10 digits.</div></div>
          <div class="field" id="f-email"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="jane@example.com"><div class="err">Enter a valid email address.</div></div>
          <div class="field"><label for="business">Business</label><select id="business" name="business"></select></div>
        </div>
      </section>

      <section class="fsec">
        <div><h3>Address</h3><p>The property address for this client.</p></div>
        <div class="fields-col">
          <div class="field"><label for="street1">Street 1</label><input id="street1" name="street1" autocomplete="off"></div>
          <div class="field"><label for="street2">Street 2</label><input id="street2" name="street2" autocomplete="off"></div>
          <div class="frow"><div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="off"></div><div class="field"><label for="state">State</label><input id="state" name="state" autocomplete="off" maxlength="2" placeholder="CA"></div></div>
          <div class="field" style="max-width:240px"><label for="zip">ZIP code</label><input id="zip" name="zip" inputmode="numeric" autocomplete="off"></div>
        </div>
      </section>

      <section class="fsec">
        <div><h3>Notes</h3><p>Internal notes about this client.</p></div>
        <div class="fields-col"><div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes"></textarea></div></div>
      </section>

      <div class="form-actions"><div class="inner">
        <a class="btn plain" href="clients.html" id="cancel">Cancel</a>
        <div class="right"><button class="btn primary" type="submit">Save client</button></div>
      </div></div>
    </form>
  </div>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/client-new.js"></script>
</body>
</html>
